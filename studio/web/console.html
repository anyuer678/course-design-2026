<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%232563eb'/%3E%3C/svg%3E">
<meta name="theme-color" content="#fafafa">
<title>产品控制台 · Studio 门户</title>
<link rel="stylesheet" href="/static/assets/kb.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body data-page="console">
<div id="toast-box"></div>
<div class="shell">
  <aside class="sidebar">
    <div class="side-brand"><span class="logo">ST</span>Studio</div>
    <div class="side-section">门户</div>
    <a class="side-link" href="/">产品矩阵</a>
    <a class="side-link" href="/audit.html">操作审计</a>
    <a class="side-link" href="/team.html">成员与邀请</a>
    <a class="side-link" href="/account.html">账户</a>
    <a class="side-link" href="/login.html">登录 / 注册</a>
    <div class="side-foot">
      <div class="badge-dot" id="ws-state">○ 轮询模式（3s）</div>
      <div class="badge-dot" id="foot-state">只绑 127.0.0.1</div>
      <div>门户跑在自研 webframe 上</div>
    </div>
  </aside>

  <div class="main">
    <div class="pagebar">
      <div class="crumb">Studio / <b>产品控制台</b></div>
      <span class="spacer"></span>
      <div id="authbox" class="authbox" style="display:flex;gap:.5rem;align-items:center">
        <span class="note" id="auth-msg"></span>
        <div id="auth-guest" style="display:flex;gap:.5rem;align-items:center">
          <span class="note">未登录——<a href="/login.html">登录 / 注册</a></span>
        </div>
        <div id="auth-user" style="display:flex;gap:.5rem;align-items:center" hidden>
          <span class="note" id="whoami"></span>
          <button id="btn-logout" class="btn btn-ghost btn-sm">登出</button>
        </div>
      </div>
    </div>

    <div class="page">
      <div class="overline">Console</div>
      <div style="display:flex;gap:.8rem;align-items:center;flex-wrap:wrap">
        <h1 id="console-title" style="margin:0">产品控制台</h1>
        <span class="note" id="console-note"></span>
        <span class="spacer" style="flex:1"></span>
        <a class="btn btn-ghost btn-sm" id="console-open" target="_blank" hidden
           style="text-decoration:none">在新窗口打开</a>
        <a class="btn btn-ghost btn-sm" href="/" style="text-decoration:none">返回矩阵</a>
      </div>
      <div class="card" id="demo-bar" hidden style="margin-top:.7rem;display:flex;
           gap:.6rem;align-items:center;padding:.55rem .9rem">
        <span class="note" id="demo-note">空产品看不出效果？</span>
        <button id="btn-demo" class="btn btn-ghost btn-sm" style="width:auto">一键注入演示数据</button>
        <span class="note" id="demo-msg"></span>
      </div>
      <div id="console-frame-box" hidden style="margin-top:.8rem;background:var(--card);
           border:1px solid var(--line);border-radius:12px;overflow:hidden">
        <iframe id="console-frame" style="width:100%;height:78vh;border:0;display:block"
                title="产品内嵌视图"></iframe>
      </div>
      <div class="card" id="console-denied" hidden>
        <p class="note" style="margin:0" id="console-denied-text"></p>
      </div>
    </div>

    <footer>Studio P0 · 数据只在本机 · 只绑 127.0.0.1 · UI 共享设计系统 kb.css 2.1</footer>
  </div>
</div>
<script src="/static/assets/echarts.min.js"></script>
<script src="/static/app.js"></script>

</body>
</html>
