<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%232563eb'/%3E%3C/svg%3E">
<meta name="theme-color" content="#fafafa">
<title>登录 / 注册 · Studio 门户</title>
<link rel="stylesheet" href="/static/assets/kb.css">
<style>
  /* 生产惯例的独立认证页：居中窄卡 + tab，脱离门户 shell */
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;
    justify-content:center;background:linear-gradient(160deg,#eef4ff 0%,#fafafa 55%,#f0fdf4 100%);
    font-family:var(--font,system-ui,'Segoe UI','Microsoft YaHei',sans-serif);color:var(--ink)}
  .brand{display:flex;align-items:center;gap:.6rem;margin-bottom:1.2rem;user-select:none}
  .brand .logo{background:var(--accent);color:#fff;border-radius:10px;padding:.3rem .6rem;
    font-weight:700;font-size:1.15rem}
  .brand b{font-size:1.25rem}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
    box-shadow:0 8px 30px rgba(15,23,42,.08);width:min(400px,92vw);padding:1.4rem 1.6rem 1.2rem}
  .tabs{display:flex;gap:.3rem;background:var(--bg);border-radius:10px;padding:.25rem;margin-bottom:1.1rem}
  .tab{flex:1;text-align:center;padding:.5rem;border-radius:8px;cursor:pointer;font-size:.92rem;
    color:var(--muted);border:none;background:transparent;font-family:inherit}
  .tab.on{background:var(--card);color:var(--ink);font-weight:600;
    box-shadow:0 1px 4px rgba(15,23,42,.12)}
  .pane{display:flex;flex-direction:column;gap:.7rem}
  .pane[hidden]{display:none}
  .pane label{font-size:.82rem;color:var(--muted)}
  .pane input{font:inherit;font-size:.95rem;padding:.55rem .8rem;border:1px solid var(--line);
    border-radius:9px;background:var(--card);color:var(--ink);width:100%;box-sizing:border-box}
  .pane input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
  .submit{font:inherit;font-size:.95rem;padding:.6rem;border:none;border-radius:9px;cursor:pointer;
    background:var(--accent);color:#fff;font-weight:600}
  .submit:disabled{opacity:.55;cursor:default}
  .msg{font-size:.85rem;min-height:1.2em}
  .msg.err{color:#dc2626}
  .foot{margin-top:1rem;font-size:.85rem;color:var(--muted)}
  .foot a{color:var(--accent);text-decoration:none}
  .hint{font-size:.78rem;color:var(--muted);margin-top:.8rem;line-height:1.5}
  .hint .kbd{background:var(--bg);border:1px solid var(--line);border-radius:5px;
    padding:.04rem .35rem;font-size:.92em;font-family:ui-monospace,Consolas,monospace}
  .back{margin-top:1.4rem;font-size:.88rem;color:var(--muted);text-decoration:none}
  .back:hover{color:var(--accent)}
</style>
</head>
<body data-page="login">
<div class="brand"><span class="logo">ST</span><b>Studio 产品门户</b></div>
<div class="card">
  <div class="tabs">
    <button type="button" class="tab on" id="tab-login">登录</button>
    <button type="button" class="tab" id="tab-register">注册</button>
  </div>

  <form class="pane" id="pane-login" onsubmit="return false">
    <div><label for="login-user">用户名</label>
      <input id="login-user" autocomplete="username" placeholder="owner 或成员名"></div>
    <div><label for="login-pass">密码</label>
      <input id="login-pass" type="password" autocomplete="current-password" placeholder="密码"></div>
    <button class="submit" id="btn-login">登 录</button>
    <div class="msg err" id="login-msg"></div>
    <div class="hint" id="envelope-hint" hidden>首次部署：恢复口令在
      <span class="kbd">studio/data/password.txt</span>——登录后请在「账户」页修改，
      修改后该文件自动作废。</div>
  </form>

  <form class="pane" id="pane-register" hidden onsubmit="return false">
    <div><label for="reg-name">用户名</label>
      <input id="reg-name" autocomplete="username" placeholder="2-20 位字母/数字/下划线/连字符"></div>
    <div><label for="reg-pass">密码</label>
      <input id="reg-pass" type="password" autocomplete="new-password" placeholder="至少 8 位"></div>
    <div><label for="reg-pass2">确认密码</label>
      <input id="reg-pass2" type="password" autocomplete="new-password" placeholder="再输一遍"></div>
    <div><label for="reg-invite">邀请码（选填）</label>
      <input id="reg-invite" autocomplete="off" placeholder="管理员提供；不填 = 只读成员"></div>
    <button class="submit" id="btn-register">注册并登录</button>
    <div class="msg err" id="reg-msg"></div>
  </form>
</div>
<div class="foot">不填邀请码注册 = viewer 只读；管理员邀请码可授予启停权限。</div>
<a class="back" href="/">← 先不登录，回产品矩阵看看</a>
<script src="/static/app.js"></script>
</body>
</html>
