<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>教师台 · 课程工坊 CourseLab</title>
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<header class="topbar" id="topbar"></header>
<main>
<h1>教师台</h1>
<div id="box"><p class="note">加载中…</p></div>
</main>
<footer>教师可见：课程维护（补充简介 / 大纲 / 发布开关）、布置任务与查看完成、本课统计；课程归属由管理员绑定。</footer>
<script src="/assets/app.js"></script>
<script>
"use strict";
var curCourse = "";
var gradeArea = null;
var box = document.getElementById("box");

CL.navbar().then(function () {
  if (!CL.me || (CL.me.role !== "teacher" && CL.me.role !== "admin")) {
    box.textContent = "";
    var card = CL.el("div", "card");
    card.appendChild(CL.el("p", null, "这一页需要教师权限（管理员可见全部）。"));
    var p = CL.el("p");
    p.appendChild(document.createTextNode("如果你已注册：管理员可用 "));
    var code = CL.el("code", null, "python server.py --promote 你的用户名 teacher");
    p.appendChild(code);
    p.appendChild(document.createTextNode(" 提升角色；未登录请先 "));
    var a = CL.el("a", null, "登录");
    a.href = "/login.html?next=/teacher.html";
    p.appendChild(a);
    p.appendChild(document.createTextNode("。"));
    card.appendChild(p);
    box.appendChild(card);
    return;
  }
  CL.api("/api/teacher/courses").then(function (res) {
    box.textContent = "";
    var list = (res.data && res.data.courses) || [];
    if (!list.length) {
      var card0 = CL.el("div", "card");
      card0.appendChild(CL.el("p", null, "还没有绑定课程——请管理员在「管理端」把课程绑定给你。"));
      box.appendChild(card0);
      return;
    }
    var bar = CL.el("div", "toolbar");
    var label = CL.el("label", "note", "选择课程：");
    var sel = document.createElement("select");
    sel.style.cssText = "font:inherit;padding:.45rem .7rem;border:1px solid #e2e8f0;border-radius:8px;background:#fff";
    list.forEach(function (c) {
      var o = document.createElement("option");
      o.value = c.id;
      o.textContent = c.course + "（" + c.id + "）";
      sel.appendChild(o);
    });
    sel.addEventListener("change", function () { load(sel.value); });
    bar.appendChild(label);
    bar.appendChild(sel);
    box.appendChild(bar);
    box.appendChild(CL.el("div", "", "")).id = "panel";
    if (sel.value) load(sel.value);
  });
});

function load(course) {
  curCourse = course;
  var panel = document.getElementById("panel");
  panel.textContent = "";
  panel.appendChild(CL.el("p", "note", "加载中…"));
  CL.api("/api/teacher/course?course=" + encodeURIComponent(course)).then(function (res) {
    panel.textContent = "";
    var d = res.data;
    if (!d || !d.ok) {
      panel.appendChild(CL.el("p", "note", (d && d.error) || "读取失败"));
      return;
    }
    var stats = CL.el("div", "stats");
    stats.appendChild(stat("已完成 " + d.totals.done));
    stats.appendChild(stat("进行中 " + d.totals.doing));
    stats.appendChild(stat("参与学生 " + d.totals.students));
    stats.appendChild(stat("记录 " + d.totals.records));
    panel.appendChild(stats);

    // 课程维护（F9）：发布开关 + 补充简介 + 大纲（平台覆盖层，注明来源）
    var upCard = CL.el("div", "card");
    upCard.appendChild(CL.el("h3", null, "课程维护（平台覆盖层）"));
    var upMsg = CL.el("p", "note",
      "补充简介与大纲会显示在课程工作区（标明由教师维护）；发布开关控制学生在目录中是否可见。");
    var upRow = CL.el("div", "toolbar");
    var pubWrap = CL.el("label", "note");
    var pub = document.createElement("input");
    pub.type = "checkbox";
    pubWrap.appendChild(pub);
    pubWrap.appendChild(document.createTextNode(" 对学生在目录中可见（发布）"));
    var sm = input("一句话补充（≤120 字）");
    var saveUp = CL.el("button", "btn", "保存");
    upRow.appendChild(pubWrap); upRow.appendChild(sm); upRow.appendChild(saveUp);
    var ot = document.createElement("textarea");
    ot.placeholder = "大纲 / 课程安排要点（≤2000 字）";
    ot.style.cssText = "font:inherit;min-height:4.5em;width:100%;margin-top:.5rem;" +
      "padding:.45rem .7rem;border:1px solid #e2e8f0;border-radius:8px;background:#fff";
    upCard.appendChild(upRow);
    upCard.appendChild(ot);
    upCard.appendChild(upMsg);
    panel.appendChild(upCard);
    CL.api("/api/courses/" + encodeURIComponent(course)).then(function (r3) {
      var m = ((r3.data && r3.data.course) || {}).meta || {};
      pub.checked = !!m.published;
      sm.value = m.summary || "";
      ot.value = m.outline || "";
    });
    saveUp.addEventListener("click", function () {
      saveUp.disabled = true;
      CL.api("/api/teacher/course/meta", { method: "POST", body: {
        course: curCourse, published: pub.checked, summary: sm.value, outline: ot.value } })
        .then(function (r4) {
          if (!r4.data || !r4.data.ok) {
            upMsg.textContent = (r4.data && r4.data.error) || "保存失败";
            return;
          }
          upMsg.textContent = "已保存。" + (pub.checked ? "" : "下架后学生在课程目录里看不到这门课。");
        })
        .catch(function () { upMsg.textContent = "网络错误，请重试。"; })
        .then(function () { saveUp.disabled = false; });
    });

    // 布置新任务
    var form = CL.el("div", "card");
    form.appendChild(CL.el("h3", null, "布置任务"));
    var row = CL.el("div", "toolbar");
    var title = input("标题（必填）");
    var body = input("说明（可选）");
    var due = document.createElement("input");
    due.type = "date";
    due.style.cssText = "font:inherit;padding:.45rem .7rem;border:1px solid #e2e8f0;border-radius:8px;background:#fff";
    var btn = CL.el("button", "btn", "布置");
    btn.addEventListener("click", function () {
      btn.disabled = true;
      CL.api("/api/teacher/tasks", { method: "POST", body: {
        course: curCourse, title: title.value, body: body.value, due_at: due.value } })
        .then(function (r2) {
          if (!r2.data || !r2.data.ok) { alert((r2.data && r2.data.error) || "布置失败"); return; }
          title.value = ""; body.value = ""; due.value = "";
          load(curCourse);
        })
        .catch(function () { alert("网络错误"); })
        .then(function () { btn.disabled = false; });
    });
    row.appendChild(title); row.appendChild(body); row.appendChild(due); row.appendChild(btn);
    form.appendChild(row);
    panel.appendChild(form);

    // 作业批阅（M12）：选任务 → 看提交 → 打分与评语（已批可改分）
    var gCard = CL.el("div", "card");
    gCard.appendChild(CL.el("h3", null, "作业批阅"));
    var gRow = CL.el("div", "toolbar");
    var gSel = document.createElement("select");
    gSel.style.cssText = "font:inherit;padding:.45rem .7rem;border:1px solid #e2e8f0;border-radius:8px;background:#fff;max-width:24rem";
    function taskOption(key, label, x) {
      var o = document.createElement("option");
      o.value = key;
      o.textContent = label + "（待批 " + x.submitted + " · 已批 " + x.graded + "）";
      gSel.appendChild(o);
    }
    d.builtin_stats.forEach(function (x) { taskOption(x.key, x.title, x); });
    d.custom.forEach(function (x) { taskOption("T" + x.id, x.title, x); });
    var gBtn = CL.el("button", "btn", "查看提交");
    var gArea = CL.el("div");
    gBtn.addEventListener("click", function () { loadSubmissions(gSel.value); });
    gRow.appendChild(gSel);
    gRow.appendChild(gBtn);
    gCard.appendChild(gRow);
    gCard.appendChild(gArea);
    panel.appendChild(gCard);
    gradeArea = gArea;

    // 教师布置的任务
    var card = CL.el("div", "card");
    card.appendChild(CL.el("h3", null, "本课自定义任务（" + d.custom.length + "）"));
    if (!d.custom.length) card.appendChild(CL.el("p", "note", "还没有——用上面的表单布置一条。"));
    d.custom.forEach(function (t) {
      var li = CL.el("div");
      li.style.cssText = "padding:.35rem 0;border-bottom:1px dashed #e2e8f0";
      li.appendChild(document.createTextNode(t.title));
      if (t.body) li.appendChild(CL.el("span", "from", "　" + t.body));
      if (t.due_at) li.appendChild(CL.el("span", "from", "　截止 " + t.due_at));
      li.appendChild(CL.el("span", "from",
        "　进行中 " + t.doing + " · 完成 " + t.done + " · 待批 " + t.submitted + " · 已批 " + t.graded));
      var del = CL.el("button", "btn btn-ghost btn-xs", "删除");
      del.style.marginLeft = ".5rem";
      del.addEventListener("click", function () {
        if (!window.confirm("删除这条任务及其完成记录？")) return;
        CL.api("/api/teacher/tasks/" + t.id + "/delete", { method: "POST", body: {} })
          .then(function () { load(curCourse); });
      });
      li.appendChild(del);
      card.appendChild(li);
    });
    panel.appendChild(card);

    // 内置任务统计
    var t = CL.el("table", "kb");
    var head = CL.el("tr");
    ["内置任务", "进行中", "已完成", "待批", "已批", ""].forEach(function (h) { head.appendChild(CL.el("th", null, h)); });
    t.appendChild(head);
    d.builtin_stats.forEach(function (x) {
      var tr = CL.el("tr");
      tr.appendChild(CL.el("td", null, x.title));
      tr.appendChild(CL.el("td", null, String(x.doing)));
      tr.appendChild(CL.el("td", null, String(x.done)));
      tr.appendChild(CL.el("td", null, String(x.submitted)));
      tr.appendChild(CL.el("td", null, String(x.graded)));
      var td = CL.el("td");
      var g = CL.el("button", "btn btn-ghost btn-xs", "批阅");
      g.addEventListener("click", function () {
        gSel.value = x.key;
        loadSubmissions(x.key);
        gCard.scrollIntoView({ behavior: "smooth" });
      });
      td.appendChild(g);
      tr.appendChild(td);
      t.appendChild(tr);
    });
    var card2 = CL.el("div", "card");
    card2.appendChild(CL.el("h3", null, "内置练习任务统计"));
    card2.appendChild(t);
    panel.appendChild(card2);

    // 本课实验次数排行（F11）
    var cardRank = CL.el("div", "card");
    cardRank.appendChild(CL.el("h3", null, "本课实验次数（Top 10）"));
    var rank = d.lab_rank || [];
    if (!rank.length) cardRank.appendChild(CL.el("p", "note", "还没有本课项目的实验记录。"));
    rank.forEach(function (x) {
      cardRank.appendChild(CL.el("div", "note", x.who + " · " + x.n + " 次"));
    });
    panel.appendChild(cardRank);

    // 最近动态
    var card3 = CL.el("div", "card");
    card3.appendChild(CL.el("h3", null, "最近动态"));
    if (!d.recent.length) card3.appendChild(CL.el("p", "note", "暂无记录。"));
    d.recent.forEach(function (r) {
      var li = CL.el("div", "note");
      li.textContent = r.updated_at + " · " + r.who + " · " +
        (r.status === "done" ? "完成" : "领取") + " · " + r.title;
      card3.appendChild(li);
    });
    panel.appendChild(card3);
  });
}

function input(placeholder) {
  var i = document.createElement("input");
  i.placeholder = placeholder;
  return i;
}

// ---------------- 作业批阅（M12）：列出提交、打分与评语（已批可改分）
function loadSubmissions(key) {
  if (!gradeArea || !key) return;
  gradeArea.textContent = "";
  gradeArea.appendChild(CL.el("p", "note", "加载中…"));
  CL.api("/api/teacher/submissions?course=" + encodeURIComponent(curCourse)
         + "&key=" + encodeURIComponent(key)).then(function (res) {
    gradeArea.textContent = "";
    var d = res.data;
    if (!d || !d.ok) {
      gradeArea.appendChild(CL.el("p", "note", (d && d.error) || "读取失败"));
      return;
    }
    if (!d.rows.length) {
      gradeArea.appendChild(CL.el("p", "note", "这个任务还没有学生提交。"));
      return;
    }
    d.rows.forEach(function (r) { gradeArea.appendChild(submissionRow(key, r)); });
  }).catch(function () {
    gradeArea.textContent = "";
    gradeArea.appendChild(CL.el("p", "note", "网络错误，请重试。"));
  });
}

function submissionRow(key, r) {
  var wrap = CL.el("div");
  wrap.style.cssText = "padding:.55rem 0;border-bottom:1px dashed #e2e8f0";
  var head = CL.el("div");
  head.appendChild(CL.el("span", "pill " + r.status,
                         r.status === "graded" ? "已批 " + r.grade + " 分" : "待批阅"));
  head.appendChild(document.createTextNode(r.who));
  head.appendChild(CL.el("span", "from", "　提交于 " + (r.submitted_at || "—")));
  wrap.appendChild(head);
  var pre = CL.el("pre", "note");
  pre.textContent = r.submission || "（空）";
  pre.style.cssText = "white-space:pre-wrap;margin:.35rem 0";
  wrap.appendChild(pre);
  var row = CL.el("div", "toolbar");
  var score = document.createElement("input");
  score.type = "number"; score.min = "0"; score.max = "100";
  score.placeholder = "分数 0-100";
  score.value = r.grade === null || r.grade === undefined ? "" : r.grade;
  var fb = input("评语（可选，≤500 字）");
  fb.value = r.feedback || "";
  var save = CL.el("button", "btn btn-xs", r.status === "graded" ? "改分" : "批阅");
  var msg = CL.el("span", "from");
  save.addEventListener("click", function () {
    save.disabled = true;
    msg.textContent = "";
    CL.api("/api/teacher/grade", { method: "POST", body: {
      course: curCourse, key: key, user_id: r.user_id,
      score: score.value === "" ? null : Number(score.value), feedback: fb.value } })
      .then(function (res2) {
        if (!res2.data || !res2.data.ok) {
          msg.textContent = (res2.data && res2.data.error) || "批阅失败";
          return;
        }
        msg.textContent = "已记录。";
        CL.toast("批阅已记录", "ok");
        loadSubmissions(key);
      })
      .catch(function () { msg.textContent = "网络错误，请重试。"; })
      .then(function () { save.disabled = false; });
  });
  row.appendChild(score);
  row.appendChild(fb);
  row.appendChild(save);
  row.appendChild(msg);
  wrap.appendChild(row);
  return wrap;
}

function stat(text) {
  var d = CL.el("span", "stat");
  d.textContent = text;
  return d;
}
</script>
</body>
</html>
