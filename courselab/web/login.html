<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%232563eb'/%3E%3C/svg%3E">
<meta name="theme-color" content="#fafafa">
<title>登录 · 课程工坊 CourseLab</title>
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<header class="topbar" id="topbar"></header>
<main>
<h1>登录</h1>
<div class="form">
  <div class="msg err" id="msg" style="display:none"></div>
  <div class="field">
    <label for="username">用户名</label>
    <input id="username" autocomplete="username" autofocus>
  </div>
  <div class="field">
    <label for="password">口令</label>
    <input id="password" type="password" autocomplete="current-password">
  </div>
  <button class="btn" id="submit">登录</button>
  <p class="note" style="margin-top:.8rem">还没有账号？<a href="/register.html">注册一个</a></p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
"use strict";
CL.navbar();
var msg = document.getElementById("msg");
function show(text) { msg.textContent = text; msg.style.display = ""; }
function submit() {
  var username = document.getElementById("username").value.trim();
  var password = document.getElementById("password").value;
  if (!username || !password) { show("请填写用户名与口令。"); return; }
  var btn = document.getElementById("submit");
  if (btn.disabled) return;                  // 防连点：请求在途时不再提交
  btn.disabled = true; btn.textContent = "登录中…";
  CL.api("/api/auth/login", { method: "POST", body: { username: username, password: password } })
    .then(function (res) {
      if (res.data && res.data.ok) { location.href = CL.nextTarget(); return; }
      show((res.data && res.data.error) || "登录失败");
    }).catch(function () { show("网络错误，请重试。"); })
    .then(function () { btn.disabled = false; btn.textContent = "登录"; });
}
document.getElementById("submit").addEventListener("click", submit);
document.addEventListener("keydown", function (e) { if (e.key === "Enter") submit(); });
</script>
</body>
</html>
