<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%232563eb'/%3E%3C/svg%3E">
<meta name="theme-color" content="#fafafa">
<title>登录 · 课程工坊 CourseLab</title>
<link rel="stylesheet" href="/assets/app.css">
<style>
  .pass-row{display:flex;gap:.5rem;align-items:center}
  .pass-row input{flex:1 1 0;width:auto;min-width:0}   /* 覆盖 .field input 的 width:100%，否则输入框在 flex 行里塌缩 */
  .pass-row .btn-xs{flex:none;width:auto}   /* app.css 的 .form .btn{width:100%} 会把显示按钮拉满、挤塌输入框 */
</style>
</head>
<body>
<header class="topbar" id="topbar"></header>
<div class="auth-page">
<div class="auth-card">
  <div class="auth-brand">
    <span class="auth-logo">课</span>
    <div><b>课程工坊 CourseLab</b><div class="meta">课程 · 实验 · 任务 · 复盘</div></div>
  </div>
  <h1>登录</h1>
  <div class="msg err" id="msg" role="alert" style="display:none"></div>
  <div class="field">
    <label for="username">用户名</label>
    <input id="username" name="username" autocomplete="username" autofocus>
  </div>
  <div class="field">
    <label for="password">口令</label>
    <div class="pass-row">
      <input id="password" name="password" type="password" autocomplete="current-password">
      <button type="button" class="btn btn-ghost btn-xs" id="toggle-pass"
              aria-label="显示口令" aria-pressed="false">显示</button>
    </div>
  </div>
  <button class="btn" id="submit">登录</button>
  <p class="auth-foot note">还没有账号？<a href="/register.html">注册一个</a></p>
</div>
</div>
<script src="/assets/app.js"></script>
<script>
"use strict";
CL.navbar();
var msg = document.getElementById("msg");
function show(text) { msg.textContent = text; msg.style.display = ""; }
(function () {   // 口令可见性切换（Vercel Guidelines：密码框标配）
  var input = document.getElementById("password");
  var btn = document.getElementById("toggle-pass");
  btn.addEventListener("click", function () {
    var showIt = input.type === "password";
    input.type = showIt ? "text" : "password";
    btn.textContent = showIt ? "隐藏" : "显示";
    btn.setAttribute("aria-pressed", showIt ? "true" : "false");
    input.focus();
  });
})();
function submit() {
  var username = document.getElementById("username").value.trim();
  var password = document.getElementById("password").value;
  if (!username || !password) { show("请填写用户名与口令。"); return; }
  var btn = document.getElementById("submit");
  if (btn.disabled) return;                  // 防连点：请求在途时不再提交
  btn.disabled = true; btn.textContent = "登录中…";
  CL.api("/api/auth/login", { method: "POST", body: { username: username, password: password } })
    .then(function (res) {
      if (res.data && res.data.ok) { location.href = CL.nextTarget(); return; }
      show((res.data && res.data.error) || "登录失败");
    }).catch(function () { show("网络错误，请重试。"); })
    .then(function () { btn.disabled = false; btn.textContent = "登录"; });
}
document.getElementById("submit").addEventListener("click", submit);
document.addEventListener("keydown", function (e) { if (e.key === "Enter") submit(); });
</script>
</body>
</html>
