<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%232563eb'/%3E%3C/svg%3E">
<meta name="theme-color" content="#fafafa">
<title>我的 · 课程工坊 CourseLab</title>
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<header class="topbar" id="topbar"></header>
<main>
<h1>我的</h1>
<div id="box"></div>
</main>
<footer>会话为服务端会话表 + HttpOnly Cookie；登出即失效。</footer>
<script src="/assets/app.js"></script>
<script>
"use strict";
CL.navbar();
var box = document.getElementById("box");

CL.api("/api/me").then(function (res) {
  var user = res.data && res.data.user;
  if (!user) {
    var card = CL.el("div", "card");
    card.appendChild(CL.el("p", null, "你还没有登录。"));
    var p = CL.el("p");
    var lg = CL.el("a", "btn", "登录");
    lg.href = "/login.html?next=/me.html";
    var rg = CL.el("a", "btn btn-ghost", "注册");
    rg.href = "/register.html";
    p.appendChild(lg);
    p.appendChild(document.createTextNode("　"));
    p.appendChild(rg);
    card.appendChild(p);
    box.appendChild(card);
    return;
  }
  var card = CL.el("div", "card");
  var dl = CL.el("dl", "kv");
  kv(dl, "昵称", user.display_name);
  kv(dl, "用户名", user.username);
  kv(dl, "角色", CL.roleName(user.role));
  kv(dl, "注册时间", user.created_at || "—");
  kv(dl, "上次登录", user.last_login || "—");
  kv(dl, "在线实验权限", res.data.can.lab_run ? "可用" : "不可用");
  card.appendChild(dl);
  var out = CL.el("button", "btn btn-ghost", "退出登录");
  out.style.marginTop = ".8rem";
  out.addEventListener("click", function () {
    CL.api("/api/auth/logout", { method: "POST", body: {} }).then(function () { location.href = "/"; });
  });
  card.appendChild(out);
  box.appendChild(card);

  // 修改口令（F7）：改后其他会话即时失效，当前会话保留
  var pwCard = CL.el("div", "card");
  pwCard.appendChild(CL.el("h3", null, "修改口令"));
  var pwRow = CL.el("div", "toolbar");
  var oldI = pwInput("当前口令");
  oldI.autocomplete = "current-password";
  var newI = pwInput("新口令（至少 8 位，含字母与数字）");
  var newI2 = pwInput("再输一遍新口令");
  var pwBtn = CL.el("button", "btn", "保存");
  var pwMsg = CL.el("p", "note", "修改成功后，你在其他设备上的登录会立即失效。");
  pwBtn.addEventListener("click", function () {
    if (newI.value !== newI2.value) { pwMsg.textContent = "两次输入的新口令不一致。"; return; }
    pwBtn.disabled = true;
    CL.api("/api/auth/password", { method: "POST", body: {
      old_password: oldI.value, new_password: newI.value } })
      .then(function (r) {
        if (!r.data || !r.data.ok) {
          pwMsg.textContent = (r.data && r.data.error) || "修改失败";
          return;
        }
        oldI.value = ""; newI.value = ""; newI2.value = "";
        pwMsg.textContent = (r.data.notice || "口令已更新") + "。";
        CL.toast("口令已更新", "ok");
      })
      .catch(function () { pwMsg.textContent = "网络错误，请重试。"; })
      .then(function () { pwBtn.disabled = false; });
  });
  pwRow.appendChild(oldI); pwRow.appendChild(newI); pwRow.appendChild(newI2);
  pwRow.appendChild(pwBtn);
  pwCard.appendChild(pwRow);
  pwCard.appendChild(pwMsg);
  box.appendChild(pwCard);

  // 我的任务（M12：显示提交、成绩与教师评语）
  var taskCard = CL.el("div", "card");
  taskCard.appendChild(CL.el("h3", null, "我的任务与成绩"));
  var taskList = CL.el("ul", "plain");
  taskList.appendChild(CL.el("li", "note", "加载中…"));
  taskCard.appendChild(taskList);
  box.appendChild(taskCard);
  CL.api("/api/tasks/mine").then(function (res2) {
    taskList.textContent = "";
    var items = (res2.data && res2.data.tasks) || [];
    if (!items.length) {
      taskList.appendChild(CL.el("li", "note",
        "还没有任务记录——去课程工作区领取一个练习任务吧。"));
      return;
    }
    var pillText = { doing: "进行中", done: "已完成", submitted: "待批阅" };
    items.forEach(function (x) {
      var li = CL.el("li");
      var label = x.status === "graded"
        ? "已批 " + (x.grade === null ? "" : x.grade) + " 分" : (pillText[x.status] || x.status);
      li.appendChild(CL.el("span", "pill " + x.status, label));
      li.appendChild(document.createTextNode(x.title || x.key));
      li.appendChild(CL.el("span", "from", "　" + x.course));
      if (x.status === "graded") {
        li.appendChild(CL.el("span", "from", "　评语：" + (x.feedback || "（无）")));
      } else if (x.submission) {
        li.appendChild(CL.el("span", "from", "　已交：" + x.submission.slice(0, 40) +
                             (x.submission.length > 40 ? "…" : "")));
      }
      taskList.appendChild(li);
    });
  }).catch(function () {
    taskList.textContent = "";
    taskList.appendChild(CL.el("li", "note", "任务记录读取失败。"));
  });

  var later = CL.el("div", "card");
  later.appendChild(CL.el("h3", null, "我的实验记录"));
  var list = CL.el("ul", "plain");
  list.appendChild(CL.el("li", "note", "加载中…"));
  later.appendChild(list);
  box.appendChild(later);
  CL.api("/api/labs/runs/mine").then(function (res) {
    list.textContent = "";
    var runs = (res.data && res.data.runs) || [];
    if (!runs.length) {
      list.appendChild(CL.el("li", "note", "还没有实验记录——去项目页的「在线实验」跑一个吧。"));
      return;
    }
    runs.forEach(function (r) {
      var li = CL.el("li");
      var verdict = r.exit_code === null ? "未完成（被停止或平台重启）" : ("exit=" + r.exit_code);
      li.textContent = r.started_at + " · " + r.pid + " · " + r.action + " · " + verdict;
      list.appendChild(li);
    });
  }).catch(function () {
    list.textContent = "";
    list.appendChild(CL.el("li", "note", "记录读取失败。"));
  });
});

function kv(dl, k, v) {
  dl.appendChild(CL.el("dt", null, k));
  dl.appendChild(CL.el("dd", null, v));
}

function pwInput(placeholder) {
  var i = document.createElement("input");
  i.type = "password";
  i.autocomplete = "new-password";
  i.placeholder = placeholder;
  return i;
}
</script>
</body>
</html>
