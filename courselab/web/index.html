<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fafafa">
<title>课程工坊 CourseLab · 课程目录</title>
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<header class="topbar" id="topbar"></header>
<main>
<h1>课程项目平台</h1>
<p class="note">每门课程一个工作区：课程内容、项目演示、练习任务都在这里。数据现算自仓库，不手工维护。</p>
<div class="stats" id="stats"></div>
<div class="toolbar">
  <input id="q" type="search" autocomplete="off" placeholder="搜索：课程名 / 项目 / 关键词">
</div>
<div class="chips" id="chips"></div>
<div class="grid" id="grid"></div>
</main>
<footer>CourseLab 课程项目平台 · 内容现算自 showcase/manifest.json 与 g2/cards.json（唯一源）</footer>
<script src="/assets/app.js"></script>
<script>
"use strict";
CL.navbar();

var DATA = [];
var grid = document.getElementById("grid");

function stat(text) {
  var d = CL.el("span", "stat");
  d.textContent = text;
  return d;
}

function load() {
  grid.textContent = "";
  grid.appendChild(CL.el("div", "skeleton"));
  grid.appendChild(CL.el("div", "skeleton w80"));
  grid.appendChild(CL.el("div", "skeleton w60"));
  CL.api("/api/courses").then(function (data) {
    grid.textContent = "";
    if (!data.ok) {
      // 网络错误已由 CL.api 归一：这里给出可操作的重试入口
      var errCard = CL.el("div", "card");
      errCard.appendChild(CL.el("p", null, "课程目录读取失败：" + (data.error || "未知错误")));
      var retry = CL.el("button", "btn btn-ghost", "重试");
      retry.addEventListener("click", function () { load(); });
      errCard.appendChild(retry);
      grid.appendChild(errCard);
      return;
    }
    DATA = data.courses;
    var stats = document.getElementById("stats");
    stats.textContent = "";
    var batches = DATA.map(function (c) { return c.batch; })
                      .filter(function (v, i, a) { return a.indexOf(v) === i; });
    stats.appendChild(stat(DATA.length + " 门课程"));
    stats.appendChild(stat(batches.length + " 个批次"));
    stats.appendChild(stat((data.cards || 0) + " 张练习卡"));
    buildChips(batches);
    render(document.getElementById("q").value.trim());
  });
}

var curBatch = "all";
var resetChips = function () {};
function buildChips(batches) {
  var box = document.getElementById("chips");
  box.textContent = "";
  var all = CL.el("button", "chip active", "全部（" + DATA.length + "）");
  all.type = "button"; all.setAttribute("aria-pressed", "true");
  all.addEventListener("click", function () { curBatch = "all"; mark(all); render(document.getElementById("q").value.trim()); });
  box.appendChild(all);
  batches.sort(function (a, b) { return Number(a) - Number(b); });
  batches.forEach(function (b) {
    var n = DATA.filter(function (c) { return c.batch === b; }).length;
    var chip = CL.el("button", "chip", "批次 " + b + "（" + n + "）");
    chip.type = "button"; chip.setAttribute("aria-pressed", "false");
    chip.addEventListener("click", function () { curBatch = b; mark(chip); render(document.getElementById("q").value.trim()); });
    box.appendChild(chip);
  });
  resetChips = function () { mark(all); };
  function mark(btn) {
    Array.prototype.forEach.call(box.children, function (c) {
      c.className = "chip" + (c === btn ? " active" : "");
      c.setAttribute("aria-pressed", c === btn ? "true" : "false");
    });
  }
}

function render(q) {
  var kw = q.toLowerCase();
  var hit = DATA.filter(function (c) {
    if (curBatch !== "all" && c.batch !== curBatch) return false;
    if (!kw) return true;
    return (c.course + " " + c.id + " " + c.title).toLowerCase().indexOf(kw) >= 0;
  });
  grid.textContent = "";
  if (!hit.length) {
    var empty = CL.el("div", "empty");
    empty.appendChild(CL.el("p", null, "没有匹配「" + q + "」的课程。"));
    var tip = CL.el("p", "note", "换个关键词，或清除筛选查看全部批次。");
    empty.appendChild(tip);
    var clear = CL.el("button", "btn btn-ghost", "清除筛选");
    clear.type = "button";
    clear.addEventListener("click", function () {
      document.getElementById("q").value = "";
      curBatch = "all";
      resetChips();
      render("");
    });
    empty.appendChild(clear);
    grid.appendChild(empty);
    return;
  }
  hit.forEach(function (c) {
    var a = CL.el("a", "card");
    a.href = "/course.html?id=" + encodeURIComponent(c.id);
    a.appendChild(CL.el("h3", null, c.course));
    a.appendChild(CL.el("div", "meta", c.id + " · " + c.title));
    if (c.summary) a.appendChild(CL.el("p", "clamp", c.summary));
    var foot = CL.el("div", "meta");
    foot.style.marginTop = ".3rem";
    var tag = CL.el("span", "tag ok", "批次 " + c.batch + " · 已交付");
    foot.appendChild(tag);
    a.appendChild(foot);
    grid.appendChild(a);
  });
}

document.getElementById("q").addEventListener("input", function () {
  render(this.value.trim());
});
load();
</script>
</body>
</html>
