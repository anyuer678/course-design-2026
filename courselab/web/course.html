<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%232563eb'/%3E%3C/svg%3E">
<meta name="theme-color" content="#fafafa">
<title>课程工作区 · 课程工坊 CourseLab</title>
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<header class="topbar" id="topbar"></header>
<main>
<div class="crumb"><a href="/">课程目录</a> / <span id="crumb-name">…</span></div>
<h1 id="title">正在加载…</h1>
<div class="meta" id="meta"></div>

<h2>一句话</h2>
<div class="card" id="summary">…</div>

<div id="teacher-note"></div>

<h2>知识点速览</h2>
<div id="knowledge"></div>

<h2 id="quiz-title">随堂测验 <span id="quiz-score" class="note"></span></h2>
<div class="card" id="quiz-card" hidden>
  <p class="note" id="quiz-note">每题单选，提交后即出分与解析。</p>
  <div id="quiz-questions"></div>
  <button class="btn" id="btn-quiz-submit" style="margin-top:.6rem">提交答案</button>
  <p class="note" id="quiz-msg"></p>
</div>

<h2 id="tasks-title">练习任务</h2>
<div id="tasks"></div>

<h2 id="pits-title">踩坑清单</h2>
<ul class="plain" id="pits"></ul>

<h2>资料</h2>
<ul class="plain" id="materials"></ul>

<h2>演示与实验</h2>
<div class="card">
  <p style="margin:.2rem 0">进入项目页看<b>在线演示</b>（自包含展示页），实验入口也在那里。</p>
  <p style="margin:.4rem 0"><a class="btn" id="to-project" href="#">进入项目页</a></p>
</div>
</main>
<footer>内容现算自仓库 README 与 g2 卡片（唯一源）；「本课补充」为平台层覆盖内容、标明维护教师。</footer>
<script src="/assets/app.js"></script>
<script>
"use strict";
var cid = CL.param("id");
CL.navbar().then(function () {
if (!cid) document.getElementById("title").textContent = "缺少课程参数 ?id=";
else {
  CL.api("/api/courses/" + encodeURIComponent(cid)).then(function (res) {
    if (!res.data || !res.data.ok) {
      document.getElementById("title").textContent = "课程不存在：" + cid;
      return;
    }
    var c = res.data.course;
    document.title = c.course + " · 课程工坊 CourseLab";
    document.getElementById("crumb-name").textContent = c.course;
    document.getElementById("title").textContent = c.course;
    document.getElementById("meta").textContent =
      c.id + " · " + c.title + " · 批次 " + c.batch;
    document.getElementById("summary").textContent = c.summary || "（该课暂无一句话摘要）";

    // 本课补充（F9：教师维护的平台层内容，与仓库现算内容并列展示、标明来源）
    var tm = c.meta || {};
    if (tm.summary || tm.outline) {
      var note = CL.el("div", "card");
      note.appendChild(CL.el("h3", null,
        "本课补充" + (tm.teacher ? "（由教师 " + tm.teacher + " 维护）" : "（平台层）")));
      if (tm.summary) note.appendChild(CL.el("p", null, tm.summary));
      if (tm.outline) {
        var pre = CL.el("pre", "note");
        pre.textContent = tm.outline;
        note.appendChild(pre);
      }
      document.getElementById("teacher-note").appendChild(note);
    }

    var kb = document.getElementById("knowledge");
    if (c.knowledge && c.knowledge.length) {
      var t = CL.el("table", "kb");
      var thead = CL.el("tr");
      ["知识点", "代码", "验证方式"].forEach(function (h) {
        var th = CL.el("th", null, h); thead.appendChild(th);
      });
      t.appendChild(thead);
      c.knowledge.forEach(function (row) {
        var tr = CL.el("tr");
        row.forEach(function (cell) { tr.appendChild(CL.el("td", null, cell)); });
        t.appendChild(tr);
      });
      kb.appendChild(t);
    } else {
      kb.appendChild(CL.el("p", "note", "（该课暂无知识点表）"));
    }

    document.getElementById("tasks-title").textContent = "练习任务";
    renderTasks(c);

    document.getElementById("pits-title").textContent = "踩坑清单（" + c.pits.length + " 条）";
    var pits = document.getElementById("pits");
    c.pits.slice(0, 5).forEach(function (p) { pits.appendChild(CL.el("li", null, p)); });
    if (c.pits.length > 5) pits.appendChild(CL.el("li", "note", "……共 " + c.pits.length + " 条，全文见项目 README。"));

    var mats = document.getElementById("materials");
    c.materials.forEach(function (m) {
      var li = CL.el("li");
      if (m.url) {
        var a = CL.el("a", null, m.path);
        a.href = m.url; a.target = "_blank"; a.rel = "noopener";
        li.appendChild(a);
      } else {
        li.textContent = m.path + (m.kind === "dir" ? "（目录）" : "（未生成）");
      }
      mats.appendChild(li);
    });

    document.getElementById("to-project").href = "/project.html?id=" + encodeURIComponent(c.id);
  });
}
});

// ---------------- 练习任务板（M4：领取/完成/进度）
function renderTasks(course) {
  var tb = course.taskboard || { items: [], custom: [], progress: { total: 0, done: 0 } };
  document.getElementById("tasks-title").textContent =
    "练习任务（已完成 " + tb.progress.done + " / " + tb.progress.total + "）";
  var box = document.getElementById("tasks");
  box.textContent = "";
  var bar = CL.el("div", "bar");
  var fill = CL.el("div", "bar-fill");
  fill.style.width =
    (tb.progress.total ? Math.round(tb.progress.done * 100 / tb.progress.total) : 0) + "%";
  bar.appendChild(fill);
  box.appendChild(bar);
  if (!CL.me) {
    var hint = CL.el("p", "note", "登录后可领取与完成，进度会记到你的账号：");
    var lg = CL.el("a", null, "去登录");
    lg.href = "/login.html?next=" + encodeURIComponent(location.pathname + location.search);
    hint.appendChild(lg);
    box.appendChild(hint);
  }
  if (tb.items.length) {
    var ul = CL.el("ul", "plain");
    tb.items.forEach(function (t) { ul.appendChild(taskRow(t, t.text, t.from)); });
    box.appendChild(ul);
  } else {
    box.appendChild(CL.el("p", "note", "（该课暂无内置练习卡）"));
  }
  if (tb.custom.length) {
    box.appendChild(CL.el("h3", null, "教师布置的任务"));
    var ul2 = CL.el("ul", "plain");
    tb.custom.forEach(function (t) {
      ul2.appendChild(taskRow(t, t.title + (t.body ? "　" + t.body : ""),
                              t.due_at ? ("截止 " + t.due_at) : ""));
    });
    box.appendChild(ul2);
  }
}

function taskRow(t, text, sub) {
  var li = CL.el("li");
  li.appendChild(CL.el("span", "pill " + (t.my || ""), pillText(t)));
  li.appendChild(document.createTextNode(text));
  if (sub) li.appendChild(CL.el("span", "from", "（" + sub + "）"));
  if (t.done_count) li.appendChild(CL.el("span", "from", "已 " + t.done_count + " 人完成"));
  if (CL.me) {
    if (!t.my) {
      var b = CL.el("button", "btn btn-ghost btn-xs", "领取");
      b.style.marginLeft = ".4rem";
      b.addEventListener("click", function () { taskAct("claim", t.key, "", b); });
      li.appendChild(b);
    } else if (t.my === "doing") {
      var input = document.createElement("input");
      input.className = "task-note";
      input.placeholder = "备注（可选）";
      var done = CL.el("button", "btn btn-xs", "完成");
      done.style.marginLeft = ".4rem";
      done.addEventListener("click", function () { taskAct("done", t.key, input.value, done); });
      li.appendChild(input);
      li.appendChild(done);
    } else if (t.my === "graded") {
      li.appendChild(CL.el("span", "from", "　评语：" + (t.feedback || "（教师未写评语）")));
    }
    if ((t.my === "submitted" || t.my === "graded") && t.submission) {
      var prev = CL.el("div", "from", "已交：" + t.submission);
      prev.style.cssText = "margin:.3rem 0 0;white-space:pre-wrap";
      li.appendChild(prev);
    }
    // 交作业：doing 首次提交；done/submitted/graded 可重交（重交清空原成绩）
    if (t.my) {
      var label = t.my === "doing" ? "提交作业"
        : (t.my === "done" ? "交作业" : (t.my === "submitted" ? "修改重交" : "重新提交"));
      var sb = CL.el("button", "btn btn-ghost btn-xs", label);
      sb.style.marginLeft = ".4rem";
      var box = CL.el("div");
      box.style.cssText = "display:none;margin:.45rem 0 0";
      var ta = document.createElement("textarea");
      ta.placeholder = "作业内容（1-2000 字" + (t.my === "submitted" || t.my === "graded"
        ? "；重交会清空原成绩" : "") + "）";
      ta.style.cssText = "font:inherit;min-height:3.5em;width:100%;padding:.45rem .7rem;" +
        "border:1px solid #e2e8f0;border-radius:8px;background:#fff";
      var go = CL.el("button", "btn btn-xs", "提交给教师批阅");
      go.style.marginTop = ".4rem";
      go.addEventListener("click", function () { taskAct("submit", t.key, ta.value, go); });
      box.appendChild(ta);
      box.appendChild(go);
      sb.addEventListener("click", function () {
        var show = box.style.display === "none";
        box.style.display = show ? "" : "none";
        if (show && !ta.value && t.submission) ta.value = t.submission;
      });
      li.appendChild(sb);
      li.appendChild(box);
    }
  }
  return li;
}

function pillText(t) {
  if (t.my === "done") return "已完成";
  if (t.my === "doing") return "进行中";
  if (t.my === "submitted") return "待批阅";
  if (t.my === "graded") {
    return "已批阅 " + (t.grade === null || t.grade === undefined ? "" : t.grade) + " 分";
  }
  return "未领取";
}

function taskAct(kind, key, note, btn) {
  btn.disabled = true;
  CL.api("/api/tasks/" + kind,
         { method: "POST", body: { course: cid, key: key, note: note, text: note } })
    .then(function (res) {
      if (!res.data || !res.data.ok) { alert((res.data && res.data.error) || "操作失败"); }
      refreshTaskboard();
    })
    .catch(function () { alert("网络错误，请重试。"); })
    .then(function () { btn.disabled = false; });
}

function initQuiz() {
  var box = document.getElementById("quiz-questions");
  CL.api("/api/quiz/" + encodeURIComponent(cid)).then(function (res) {
    if (!res.data || !res.data.ok) return;          // 无测验：卡保持隐藏
    document.getElementById("quiz-card").hidden = false;
    box.textContent = "";
    (res.data.questions || []).forEach(function (qz) {
      var wrap = document.createElement("div");
      wrap.style.marginBottom = ".8rem";
      var q = document.createElement("p");
      q.style.margin = ".3rem 0";
      q.textContent = (qz.id + 1) + ". " + qz.q;
      wrap.appendChild(q);
      qz.options.forEach(function (opt, idx) {
        var lab = document.createElement("label");
        lab.style.display = "block";
        lab.style.marginLeft = "1rem";
        var radio = document.createElement("input");
        radio.type = "radio"; radio.name = "quiz-" + qz.id; radio.value = idx;
        lab.appendChild(radio);
        lab.appendChild(document.createTextNode(" " + opt));
        wrap.appendChild(lab);
      });
      box.appendChild(wrap);
    });
    document.getElementById("btn-quiz-submit").onclick = function () {
      var btn = this;
      var answers = {};
      (res.data.questions || []).forEach(function (qz) {
        var picked = box.querySelector('input[name="quiz-' + qz.id + '"]:checked');
        answers[qz.id] = picked ? Number(picked.value) : null;
      });
      btn.disabled = true; btn.textContent = "判分中…";
      CL.api("/api/quiz/" + encodeURIComponent(cid) + "/submit",
             { method: "POST", body: { answers: answers } })
        .then(function (r) {
          var msg = document.getElementById("quiz-msg");
          if (!r.data || !r.data.ok) {
            msg.textContent = (r.data && r.data.error) || "提交失败";
            return;
          }
          document.getElementById("quiz-score").textContent =
            "得分 " + r.data.score + " / " + r.data.total;
          (r.data.detail || []).forEach(function (d) {
            var q = box.querySelector('input[name="quiz-' + d.id + '"]');
            var wrap = q && q.closest("div");
            if (!wrap) return;
            var mark = document.createElement("p");
            mark.style.margin = ".2rem 0";
            mark.style.color = d.ok ? "#059669" : "#dc2626";
            mark.textContent = (d.ok ? "✓ 正确。" : "✗ 正确答案："
              + (res.data.questions[d.id].options[d.answer]) + "。")
              + d.explain;
            wrap.appendChild(mark);
            box.querySelectorAll('input[name="quiz-' + d.id + '"]')
              .forEach(function (inp) { inp.disabled = true; });
          });
          msg.textContent = "已记录" + (res.data.signed_in ? "到你的成绩" : "（未登录不计分）") + "。";
          btn.disabled = true; btn.textContent = "已提交";
        })
        .catch(function () { msg.textContent = "网络错误，请重试。"; })
        .then(function () { if (btn.textContent === "判分中…") { btn.disabled = false; btn.textContent = "提交答案"; } });
    };
  });
}
initQuiz();

function refreshTaskboard() {
  CL.api("/api/courses/" + encodeURIComponent(cid)).then(function (res) {
    if (res.data && res.data.ok) renderTasks(res.data.course);
  });
}
</script>
</body>
</html>
