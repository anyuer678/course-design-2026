<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%232563eb'/%3E%3C/svg%3E">
<meta name="theme-color" content="#fafafa">
<title>项目页 · 课程工坊 CourseLab</title>
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<header class="topbar" id="topbar"></header>
<main>
<div class="crumb"><a href="/">课程目录</a> / <a id="crumb-course" href="/">…</a> / <span id="crumb-id">…</span></div>
<h1 id="title">正在加载…</h1>
<div class="meta" id="meta"></div>

<div class="tabs">
  <button class="tab active" data-pane="info">详情</button>
  <button class="tab" data-pane="demo">在线演示</button>
  <button class="tab" data-pane="lab">在线实验</button>
</div>

<div class="pane active" id="pane-info">
  <dl class="kv">
    <dt>课程</dt><dd id="kv-course">…</dd>
    <dt>项目</dt><dd id="kv-project">…</dd>
    <dt>状态</dt><dd id="kv-status">…</dd>
  </dl>
  <h2>一句话</h2>
  <p id="info-summary" class="note">…</p>
  <h2>资料</h2>
  <ul class="plain" id="info-materials"></ul>
  <h2>踩坑清单（前 5 条）</h2>
  <ul class="plain" id="info-pits"></ul>
</div>

<div class="pane" id="pane-demo">
  <p class="note" id="demo-note">这是项目自带的自包含展示页（双击即看的那种），此处原样内嵌。</p>
  <iframe class="demo" id="demo-frame" title="项目展示页"></iframe>
  <p class="note" style="margin-top:.5rem"><a id="demo-open" href="#" target="_blank" rel="noopener">在新标签页打开演示页</a></p>
</div>

<div class="pane" id="pane-lab">
  <div class="msg err" id="lab-msg" style="display:none"></div>
  <div id="lab-guest">
    <div class="hint">登录后即可在本页直接跑这个项目的演示 / 测试 / 服务，日志实时滚动。</div>
    <p class="note" id="lab-auth"></p>
  </div>
  <div id="lab-console" style="display:none">
    <div class="toolbar" id="lab-buttons"></div>
    <div class="meta"><span id="lab-status">还没有运行中的实验。</span>
      <a id="lab-open" style="display:none;margin-left:.5rem" target="_blank" rel="noopener">打开服务页面</a>
    </div>
    <pre class="logbox" id="lab-log">（点上面的按钮开始，日志会实时滚动）</pre>
  </div>
</div>
</main>
<footer>演示页是项目生成物（零依赖静态页）；平台数据现算自仓库。</footer>
<script src="/assets/app.js"></script>
<script>
"use strict";
var tabs = document.querySelectorAll(".tab");
Array.prototype.forEach.call(tabs, function (t) {
  t.addEventListener("click", function () {
    Array.prototype.forEach.call(tabs, function (x) {
      x.className = "tab" + (x === t ? " active" : "");
      document.getElementById("pane-" + x.dataset.pane).className =
        "pane" + (x === t ? " active" : "");
    });
  });
});

var pid = CL.param("id");
CL.navbar().then(function () {
if (!pid) document.getElementById("title").textContent = "缺少项目参数 ?id=";
else {
  CL.api("/api/courses/" + encodeURIComponent(pid)).then(function (res) {
    if (!res.data || !res.data.ok) {
      document.getElementById("title").textContent = "项目不存在：" + pid;
      return;
    }
    var c = res.data.course;
    document.title = c.id + " · 课程工坊 CourseLab";
    document.getElementById("crumb-course").textContent = c.course;
    document.getElementById("crumb-course").href = "/course.html?id=" + encodeURIComponent(c.id);
    document.getElementById("crumb-id").textContent = c.id;
    document.getElementById("title").textContent = c.id + " · " + c.title;
    document.getElementById("meta").textContent = "对应课程：" + c.course + " · 批次 " + c.batch;
    document.getElementById("kv-course").textContent = c.course;
    document.getElementById("kv-project").textContent = c.id + " · " + c.title;
    document.getElementById("kv-status").textContent = c.status === "done" ? "已交付" : "待补";
    document.getElementById("info-summary").textContent = c.summary || "（暂无摘要）";

    var mats = document.getElementById("info-materials");
    c.materials.forEach(function (m) {
      var li = CL.el("li");
      if (m.url) {
        var a = CL.el("a", null, m.path);
        a.href = m.url; a.target = "_blank"; a.rel = "noopener";
        li.appendChild(a);
      } else {
        li.textContent = m.path + (m.kind === "dir" ? "（目录）" : "（未生成）");
      }
      mats.appendChild(li);
    });
    var pits = document.getElementById("info-pits");
    c.pits.slice(0, 5).forEach(function (p) { pits.appendChild(CL.el("li", null, p)); });

    if (c.page) {
      var url = "/repo/" + c.page;
      document.getElementById("demo-frame").src = url;
      document.getElementById("demo-open").href = url;
    } else {
      document.getElementById("demo-note").textContent = "该项目暂无展示页。";
    }

    var labAuth = document.getElementById("lab-auth");
    var labInfo = c.lab || { actions: [], port: null, ui: false };
    if (CL.me) {
      document.getElementById("lab-guest").style.display = "none";
      document.getElementById("lab-console").style.display = "";
      renderLabButtons(labInfo);
    } else {
      labAuth.textContent = "";
      labAuth.appendChild(document.createTextNode("现在就可以："));
      var a1 = CL.el("a", null, "登录");
      a1.href = "/login.html?next=" + encodeURIComponent(location.pathname + location.search);
      var a2 = CL.el("a", null, "注册");
      a2.href = "/register.html";
      labAuth.appendChild(a1);
      labAuth.appendChild(document.createTextNode(" / "));
      labAuth.appendChild(a2);
    }
  });
}
});

// ---------------- 在线实验（M3）
var labInfo = { actions: [], port: null, ui: false };
var labEs = null;
var labRunId = null;
var labPid = pid;

function labMsg(text) {
  var m = document.getElementById("lab-msg");
  m.textContent = text;
  m.style.display = text ? "" : "none";
}

function renderLabButtons(info) {
  labInfo = info;
  var box = document.getElementById("lab-buttons");
  box.textContent = "";
  (info.actions || []).forEach(function (a) {
    var b = CL.el("button", "btn btn-ghost", a.label);
    b.addEventListener("click", function () { startAction(a, b); });
    box.appendChild(b);
  });
  var stop = CL.el("button", "btn", "停止当前");
  stop.id = "lab-stop";
  stop.disabled = true;
  stop.addEventListener("click", stopAction);
  box.appendChild(stop);
  if (!info.actions || !info.actions.length) {
    box.appendChild(CL.el("span", "note", "该项目未接平台实验动作。"));
  }
}

function startAction(a, btn) {
  labMsg("");
  btn.disabled = true;
  CL.api("/api/labs/run", { method: "POST", body: { project: labPid, action: a.id } })
    .then(function (res) {
      if (!res.data || !res.data.ok) {
        labMsg((res.data && res.data.error) || "启动失败");
        return;
      }
      openStream(res.data.run_id, res.data.port);
    })
    .catch(function () { labMsg("网络错误，请重试。"); })
    .then(function () { btn.disabled = false; });
}

function stopAction() {
  if (!labRunId) return;
  CL.api("/api/labs/runs/" + labRunId + "/stop", { method: "POST", body: {} })
    .then(function () { labMsg(""); })
    .catch(function () { labMsg("停止失败"); });
}

function setStopEnabled(on) {
  var s = document.getElementById("lab-stop");
  if (s) s.disabled = !on;
}

function appendLabLine(text) {
  var log = document.getElementById("lab-log");
  var atBottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 8;
  log.textContent += text + "\n";
  if (atBottom) log.scrollTop = log.scrollHeight;
}

function openStream(runId, port) {
  if (labEs) { labEs.close(); }
  labRunId = runId;
  setStopEnabled(true);
  var log = document.getElementById("lab-log");
  log.textContent = "";
  var status = document.getElementById("lab-status");
  status.textContent = "运行中（" + runId + "）……";
  if (port && labInfo.ui) {
    var open = document.getElementById("lab-open");
    open.href = "http://127.0.0.1:" + port + "/";
    open.style.display = "";
  }
  labEs = new EventSource("/api/labs/runs/" + runId + "/log");
  labEs.addEventListener("log", function (e) { appendLabLine(JSON.parse(e.data)); });
  labEs.addEventListener("done", function (e) {
    var d = JSON.parse(e.data);
    labEs.close();
    labEs = null;
    labRunId = null;
    setStopEnabled(false);
    document.getElementById("lab-open").style.display = "none";
    status.textContent = "结束：exit=" + d.exit + " · " + d.seconds + "s（" + d.action + "）";
    updateQueue();
  });
  labEs.onerror = function () { /* 结束后连接关闭属正常 */ };
}

function updateQueue() {
  CL.api("/api/labs/active").then(function (res) {
    if (!res.data || !res.data.ok) return;
    var running = res.data.running || [];
    if (!running.length) {
      if (!labRunId) document.getElementById("lab-status").textContent = "当前没有运行中的实验。";
      return;
    }
    var parts = running.map(function (r) {
      return r.pid + "（" + r.action + "，" + r.seconds + "s）";
    });
    if (!labRunId) {
      document.getElementById("lab-status").textContent =
        "平台上运行中：" + parts.join("、") + "　[限额 " + res.data.limit + "]";
    }
  }).catch(function () {});
}
</script>
</body>
</html>
