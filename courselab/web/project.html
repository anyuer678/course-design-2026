<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>项目页 · 课程工坊 CourseLab</title>
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<header class="topbar" id="topbar"></header>
<main>
<div class="crumb"><a href="/">课程目录</a> / <a id="crumb-course" href="/">…</a> / <span id="crumb-id">…</span></div>
<h1 id="title">正在加载…</h1>
<div class="meta" id="meta"></div>

<div class="tabs">
  <button class="tab active" data-pane="info">详情</button>
  <button class="tab" data-pane="demo">在线演示</button>
  <button class="tab" data-pane="lab">在线实验</button>
</div>

<div class="pane active" id="pane-info">
  <dl class="kv">
    <dt>课程</dt><dd id="kv-course">…</dd>
    <dt>项目</dt><dd id="kv-project">…</dd>
    <dt>状态</dt><dd id="kv-status">…</dd>
  </dl>
  <h2>一句话</h2>
  <p id="info-summary" class="note">…</p>
  <h2>资料</h2>
  <ul class="plain" id="info-materials"></ul>
  <h2>踩坑清单（前 5 条）</h2>
  <ul class="plain" id="info-pits"></ul>
</div>

<div class="pane" id="pane-demo">
  <p class="note" id="demo-note">这是项目自带的自包含展示页（双击即看的那种），此处原样内嵌。</p>
  <iframe class="demo" id="demo-frame" title="项目展示页"></iframe>
  <p class="note" style="margin-top:.5rem"><a id="demo-open" href="#" target="_blank" rel="noopener">在新标签页打开演示页</a></p>
</div>

<div class="pane" id="pane-lab">
  <div class="hint" id="lab-hint">在线实验将在 M3 里程碑接入：登录用户在平台上直接跑演示/测试并看实时日志。</div>
  <p class="note">现在就能用：打开课设仓库根目录，双击 <b>lab.bat</b> 用本地实验台（本机控制台，可启停服务/跑演示/跑测试）。</p>
  <p class="note" id="lab-auth"></p>
</div>
</main>
<footer>演示页是项目生成物（零依赖静态页）；平台数据现算自仓库。</footer>
<script src="/assets/app.js"></script>
<script>
"use strict";
CL.navbar();

var tabs = document.querySelectorAll(".tab");
Array.prototype.forEach.call(tabs, function (t) {
  t.addEventListener("click", function () {
    Array.prototype.forEach.call(tabs, function (x) {
      x.className = "tab" + (x === t ? " active" : "");
      document.getElementById("pane-" + x.dataset.pane).className =
        "pane" + (x === t ? " active" : "");
    });
  });
});

var pid = CL.param("id");
if (!pid) document.getElementById("title").textContent = "缺少项目参数 ?id=";
else {
  CL.api("/api/courses/" + encodeURIComponent(pid)).then(function (res) {
    if (!res.data || !res.data.ok) {
      document.getElementById("title").textContent = "项目不存在：" + pid;
      return;
    }
    var c = res.data.course;
    document.title = c.id + " · 课程工坊 CourseLab";
    document.getElementById("crumb-course").textContent = c.course;
    document.getElementById("crumb-course").href = "/course.html?id=" + encodeURIComponent(c.id);
    document.getElementById("crumb-id").textContent = c.id;
    document.getElementById("title").textContent = c.id + " · " + c.title;
    document.getElementById("meta").textContent = "对应课程：" + c.course + " · 批次 " + c.batch;
    document.getElementById("kv-course").textContent = c.course;
    document.getElementById("kv-project").textContent = c.id + " · " + c.title;
    document.getElementById("kv-status").textContent = c.status === "done" ? "已交付" : "待补";
    document.getElementById("info-summary").textContent = c.summary || "（暂无摘要）";

    var mats = document.getElementById("info-materials");
    c.materials.forEach(function (m) {
      var li = CL.el("li");
      if (m.url) {
        var a = CL.el("a", null, m.path);
        a.href = m.url; a.target = "_blank"; a.rel = "noopener";
        li.appendChild(a);
      } else {
        li.textContent = m.path + (m.kind === "dir" ? "（目录）" : "（未生成）");
      }
      mats.appendChild(li);
    });
    var pits = document.getElementById("info-pits");
    c.pits.slice(0, 5).forEach(function (p) { pits.appendChild(CL.el("li", null, p)); });

    if (c.page) {
      var url = "/repo/" + c.page;
      document.getElementById("demo-frame").src = url;
      document.getElementById("demo-open").href = url;
    } else {
      document.getElementById("demo-note").textContent = "该项目暂无展示页。";
    }

    var labAuth = document.getElementById("lab-auth");
    if (CL.me) {
      labAuth.textContent = "已登录（" + CL.me.display_name + "）——M3 上线后此处直接可用。";
    } else {
      labAuth.innerHTML = "";
      labAuth.appendChild(document.createTextNode("登录后即可使用（M3 上线时）："));
      var a1 = CL.el("a", null, "登录");
      a1.href = "/login.html?next=" + encodeURIComponent(location.pathname + location.search);
      var a2 = CL.el("a", null, "注册");
      a2.href = "/register.html";
      labAuth.appendChild(a1);
      labAuth.appendChild(document.createTextNode(" / "));
      labAuth.appendChild(a2);
    }
  });
}
</script>
</body>
</html>
