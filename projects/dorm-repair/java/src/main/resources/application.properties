# B18 平台层默认配置：H2 **文件库**，所以进程退出后数据还在——
# 重启恢复不是嘴上说的，是 `RestartPersistenceTest` 真关再真开验出来的。
# 端口默认 8083：本机 8010 归 B16 原型，短链 demo 也占过端口，分开写死免得互相抢。
#
# 别加 AUTO_SERVER=TRUE：H2 不允许它和 DB_CLOSE_ON_EXIT=FALSE 同时出现，
# 真启动时直接 Feature not supported 而起不来（本轮实测踩过，见 docs/09 第 1 节）。
spring.datasource.url=jdbc:h2:file:${REPAIR_DB:./target/repair-db};DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
server.port=${REPAIR_PORT:8083}
spring.main.banner-mode=off
logging.level.root=WARN
management.endpoints.web.exposure.include=health
