<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" font-family="system-ui,'Microsoft YaHei',sans-serif">
  <defs>
    <marker id="seq" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="seqr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8b93a1"/>
    </marker>
  </defs>
  <rect width="900" height="540" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="650" fill="#16181d">时序图：登录（F1）—— 校验、限流与会话签发</text>

  <!-- lifelines -->
  <rect x="70" y="46" width="150" height="34" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.3"/>
  <text x="145" y="68" text-anchor="middle" font-size="13" font-weight="650" fill="#16181d">浏览器</text>
  <rect x="330" y="46" width="170" height="34" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="1.3"/>
  <text x="415" y="68" text-anchor="middle" font-size="13" font-weight="650" fill="#16181d">HTTP 服务层</text>
  <rect x="590" y="46" width="150" height="34" rx="7" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.3"/>
  <text x="665" y="68" text-anchor="middle" font-size="13" font-weight="650" fill="#16181d">领域层 auth</text>
  <rect x="790" y="46" width="90" height="34" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="1.3"/>
  <text x="835" y="68" text-anchor="middle" font-size="13" font-weight="650" fill="#16181d">SQLite</text>
  <line x1="145" y1="80" x2="145" y2="500" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="415" y1="80" x2="415" y2="500" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="665" y1="80" x2="665" y2="500" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="835" y1="80" x2="835" y2="500" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5 4"/>

  <line x1="145" y1="112" x2="415" y2="112" stroke="#334155" stroke-width="1.5" marker-end="url(#seq)"/>
  <text x="280" y="104" text-anchor="middle" font-size="12" fill="#16181d">POST /api/auth/login {username, password}</text>

  <line x1="415" y1="146" x2="665" y2="146" stroke="#334155" stroke-width="1.5" marker-end="url(#seq)"/>
  <text x="540" y="138" text-anchor="middle" font-size="12" fill="#16181d">登录限流检查（同用户名+IP：10 分钟 5 次失败 → 429）</text>

  <line x1="665" y1="180" x2="835" y2="180" stroke="#334155" stroke-width="1.5" marker-end="url(#seq)"/>
  <text x="750" y="172" text-anchor="middle" font-size="12" fill="#16181d">SELECT 用户行（参数化 SQL）</text>
  <line x1="835" y1="208" x2="665" y2="208" stroke="#8b93a1" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#seqr)"/>
  <text x="750" y="200" text-anchor="middle" font-size="12" fill="#5f6773">用户行（salt / iter 随行）</text>

  <rect x="630" y="228" width="70" height="44" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.2"/>
  <text x="665" y="246" text-anchor="middle" font-size="11.5" fill="#16181d">PBKDF2</text>
  <text x="665" y="262" text-anchor="middle" font-size="11.5" fill="#16181d">恒时比较</text>
  <text x="720" y="254" font-size="11.5" fill="#5f6773">120000 迭代 · 16B 盐随行</text>

  <rect x="180" y="288" width="470" height="52" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.1"/>
  <text x="192" y="309" font-size="11.5" fill="#b91c1c">失败路径：不通过 → 计入同一限流窗口 → 401（统一话术"用户名或口令不对"，</text>
  <text x="192" y="327" font-size="11.5" fill="#b91c1c">不给猜测者喂信息）</text>

  <line x1="665" y1="368" x2="835" y2="368" stroke="#334155" stroke-width="1.5" marker-end="url(#seq)"/>
  <text x="750" y="360" text-anchor="middle" font-size="12" fill="#16181d">INSERT sessions（256-bit 令牌，默认 12h）</text>

  <line x1="415" y1="404" x2="145" y2="404" stroke="#334155" stroke-width="1.5" marker-end="url(#seq)"/>
  <text x="280" y="396" text-anchor="middle" font-size="12" fill="#16181d">200 + Set-Cookie（HttpOnly · SameSite=Lax · Path=/）</text>

  <rect x="70" y="438" width="760" height="52" fill="#fffbeb" stroke="#b45309" stroke-width="1.1"/>
  <text x="84" y="459" font-size="11.5" fill="#92400e">改口令（F7）：校验旧口令计入同一限流；成功后该用户全部其他会话即时失效</text>
  <text x="84" y="477" font-size="11.5" fill="#92400e">（自检含"旧口令登录 401 / 新口令 200 / 另一会话失效"专项）</text>
</svg>
